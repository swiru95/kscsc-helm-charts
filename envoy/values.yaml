gateway:
  name: envoy-gateway
  className: envoy-gateway-class
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - name: envoy-gateway-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: tcp
      protocol: TCP
      port: 9997
      allowedRoutes:
        namespaces:
          from: All

gatewayClass:
  create: true
  name: envoy-gateway-class
  controllerName: gateway.envoyproxy.io/gatewayclass-controller

controller:
  enabled: true
  replicaCount: 1
  image:
    repository: envoyproxy/envoy-gateway
    tag: main
    pullPolicy: IfNotPresent

dataPlane:
  enabled: false
  managed: true
  replicaCount: 1
  image:
    repository: envoyproxy/envoy
    tag: v1.29-latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 10000

httproute:
  name: envoy-httproute

tcproute:
  name: envoy-tcproute

# Static IP assigned by MetalLB to the Envoy Gateway LoadBalancer service
service:
  loadBalancerIP: "x"

# envoyproxy/gateway-helm chart tolerations (single-node cluster with GPU taint)
deployment:
  pod:
    tolerations:
      - key: "nvidia.com/gpu"
        operator: "Exists"
        effect: "NoSchedule"

certgen:
  job:
    tolerations:
      - key: "nvidia.com/gpu"
        operator: "Exists"
        effect: "NoSchedule"

coraza:
  enabled: false

# cert-manager Certificate — issued by step-ca, stored in this namespace for Gateway TLS
certificate:
  enabled: true
  name: envoy-gateway-tls
  secretName: envoy-gateway-tls
  issuerRef:
    name: kscsc-ca-issuer
    kind: ClusterIssuer
  dnsNames:
    - actualbudget.kscsc.local
    - ollama.kscsc.local
    - openui.kscsc.local
    - ca.kscsc.local
    # Add a hostname here for every new HTTPRoute you add
