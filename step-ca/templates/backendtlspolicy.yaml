{{- if .Values.backendTLS.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: {{ .Release.Name }}-backend-tls
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: {{ .Values.gateway.serviceName }}
  validation:
    caCertificateRefs:
      - name: step-ca-backend-tls-ca
        group: ""
        kind: ConfigMap
    hostname: {{ .Values.backendTLS.hostname }}
{{- end }}
