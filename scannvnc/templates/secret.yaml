{{- if and .Values.searchEngines.createSecret (not .Values.searchEngines.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "scannvnc.secretName" . }}
  labels:
    app: {{ include "scannvnc.name" . }}
type: Opaque
stringData:
  # Read-only, metadata-lookup-scoped search-engine keys. The CLI reads these
  # from the environment (see scannvnc/config.py).
  SHODAN_API_KEY: {{ .Values.searchEngines.shodanApiKey | quote }}
  ZOOMEYE_API_KEY: {{ .Values.searchEngines.zoomeyeApiKey | quote }}
  CENSYS_PAT: {{ .Values.searchEngines.censysPat | quote }}
  CENSYS_ORG_ID: {{ .Values.searchEngines.censysOrgId | quote }}
  {{- if not .Values.llm.existingSecret }}
  LLAMA_API_KEY: {{ .Values.llm.apiKey | quote }}
  {{- end }}
{{- end }}
