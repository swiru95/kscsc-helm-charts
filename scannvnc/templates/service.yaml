apiVersion: v1
kind: Service
metadata:
  name: {{ include "scannvnc.dashboardName" . }}
  labels:
    app: {{ include "scannvnc.name" . }}
    component: dashboard
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: {{ include "scannvnc.name" . }}
    component: dashboard
