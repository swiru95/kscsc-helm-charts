{{- if .Values.gateway.enabled }}
{{- $backend := .Values.gateway.serviceName | default (include "scannvnc.dashboardName" .) }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-https
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      sectionName: {{ .Values.gateway.httpsListenerName }}
  hostnames:
    - {{ .Values.gateway.hostname }}
  rules:
    - backendRefs:
        - name: {{ $backend }}
          port: {{ .Values.service.port }}
      timeouts:
        request: {{ .Values.gateway.timeout }}
        backendRequest: {{ .Values.gateway.timeout }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-http-{{ if .Values.gateway.httpDirect }}direct{{ else }}redirect{{ end }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      sectionName: {{ .Values.gateway.httpListenerName }}
  hostnames:
    - {{ .Values.gateway.hostname }}
  rules:
    {{- if .Values.gateway.httpDirect }}
    - backendRefs:
        - name: {{ $backend }}
          port: {{ .Values.service.port }}
    {{- else }}
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
    {{- end }}
{{- end }}
