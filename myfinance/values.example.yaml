# Example values - real deployment values live in the private config/ submodule.
# PostgreSQL authenticates with certificates issued by the in-cluster step-ca,
# so it needs no password. The one credential MyFinance does take is the
# llama-server API key behind the Report page - kept in a Secret, never here.
affinity: {}
backend:
  image:
    pullPolicy: IfNotPresent
    repository: ghcr.io/swiru95/myfinance-backend
    tag: 6ace65562d10c6a350479172405b461c4afaa587
  resources:
    limits:
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 128Mi
  service:
    port: 8000
cors:
  origins:
  - https://myfinance.kscsc.local
frontend:
  image:
    pullPolicy: IfNotPresent
    repository: ghcr.io/swiru95/myfinance-frontend
    tag: 6ace65562d10c6a350479172405b461c4afaa587
  resources:
    limits:
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 128Mi
  service:
    port: 3000
gateway:
  apiPathPrefix: /api
  hostname: myfinance.kscsc.local
  httpDirect: false
  httpListenerName: http
  httpsListenerName: https
  name: envoy-gateway
  namespace: envoy-gateway-system
  serviceName: ""
  servicePort: 3000
  timeout: 60s
imagePullSecrets: []
networkPolicy:
  enabled: true
  ingress:
    enabled: true
    namespace: envoy-gateway-system
    podLabels:
      app.kubernetes.io/name: envoy
llm:
  enabled: true
  baseUrl: https://llama.kscsc.local:8443
  model: Thinker
  translateModel: Bielik
  # The key is deliberately NOT in this file. Create the Secret once, out of
  # band, and the chart mounts it:
  #
  #   kubectl create secret generic myfinance-llm -n myfinance \
  #     --from-literal=llm-api-key="$(ssh gx10 sudo cat /etc/llama-server/api.key)"
  #
  # Setting `apiKey` here instead would work, but would put a root-equivalent
  # inference credential into git.
  apiKey: ""
  existingSecret: myfinance-llm
  secretKey: llm-api-key
  tls:
    verify: true
    caConfigMap:
      enabled: true
      namespace: step-ca
      name: step-ca-step-certificates-certs
      rootKey: root_ca.crt
      intermediateKey: intermediate_ca.crt
    caBundle: ""
    mountPath: /etc/myfinance/llm-ca
  mtls:
    enabled: true
    certFile: /var/run/autocert.step.sm/site.crt
    keyFile: /var/run/autocert.step.sm/site.key
  timeout: 900
nodeSelector: {}
postgres:
  enabled: true
pvc:
  accessModes:
  - ReadWriteOnce
  enabled: true
  name: ""
  size: 2Gi
  storageClass: ""
tolerations:
- effect: NoSchedule
  key: nvidia.com/gpu
  operator: Exists
