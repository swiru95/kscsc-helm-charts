apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "myfinance.frontendName" . }}
  labels:
    app: {{ include "myfinance.name" . }}
    component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "myfinance.name" . }}
      component: frontend
  template:
    metadata:
      labels:
        app: {{ include "myfinance.name" . }}
        component: frontend
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.service.port }}
          env:
            # Deliberately no BACKEND_ORIGIN: the next.config.js rewrite is
            # resolved at build time, so it cannot be steered from here. The
            # gateway routes /api/* to the backend instead (see httproute.yaml).
            - name: NEXT_TELEMETRY_DISABLED
              value: "1"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
{{ toYaml .Values.frontend.resources | indent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
