apiVersion: v1
kind: Service
metadata:
  name: {{ include "myfinance.backendName" . }}
  labels:
    app: {{ include "myfinance.name" . }}
    component: backend
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: {{ include "myfinance.name" . }}
    component: backend
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "myfinance.frontendName" . }}
  labels:
    app: {{ include "myfinance.name" . }}
    component: frontend
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: {{ include "myfinance.name" . }}
    component: frontend
