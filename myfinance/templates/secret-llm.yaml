{{- if and .Values.llm.enabled .Values.llm.apiKey (not .Values.llm.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "myfinance.fullname" . }}-llm
  labels:
    app: {{ include "myfinance.name" . }}
    component: backend
type: Opaque
stringData:
  {{ .Values.llm.secretKey }}: {{ .Values.llm.apiKey | quote }}
{{- end }}
