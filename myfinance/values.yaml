# MyFinance — two images built by GitHub Actions in the MyFinance repo and
# pushed to GHCR, tagged with the source commit (like news-bot) rather than
# :latest, so a rollback is a values change instead of a rebuild.
# Source: https://github.com/swiru95/MyFinance
backend:
  image:
    repository: ghcr.io/swiru95/myfinance-backend
    tag: "6ace65562d10c6a350479172405b461c4afaa587"
    pullPolicy: IfNotPresent
  service:
    port: 8000
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

frontend:
  image:
    repository: ghcr.io/swiru95/myfinance-frontend
    tag: "6ace65562d10c6a350479172405b461c4afaa587"
    pullPolicy: IfNotPresent
  service:
    port: 3000
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

# Both GHCR packages are public, so the kubelet pulls them anonymously and no
# Secret is needed. If either package is ever made private, put the pull secret
# back here and create it in the namespace:
#   - name: ghcr-pull-secret
imagePullSecrets: []

# The gateway splits one hostname across both Services by path, so the browser
# stays on a single origin and CORS is never exercised. Set anyway, so a request
# that does arrive with an Origin header is answered correctly.
#
# Note there is deliberately no BACKEND_ORIGIN here: `next build` bakes the
# next.config.js rewrite destination into .next/routes-manifest.json, so setting
# it at runtime does nothing. See gateway.apiPathPrefix below.
cors:
  origins:
    - https://myfinance.kscsc.local

gateway:
  name: envoy-gateway
  namespace: envoy-gateway-system
  httpsListenerName: https
  httpListenerName: http
  hostname: myfinance.kscsc.local
  # Blank means "this release's frontend Service"; override only to route the
  # hostname somewhere else.
  serviceName: ""
  servicePort: 3000
  # Requests under this prefix are sent to the backend Service instead of the
  # frontend. It must match the `BASE` in frontend/src/lib/api.ts.
  apiPathPrefix: /api
  httpDirect: false
  timeout: 60s

# SQLite lives on a single file — ReadWriteOnce, one replica, Recreate on
# upgrade so two backends never open the same DB.
pvc:
  enabled: true
  # leave blank to use cluster default storageClass
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 2Gi
  # optional explicit claim name; if empty, chart will create one based on release name
  name: ""

# --- Wallet assessment (llama-server on gx10) ------------------------------
# The Report page asks a local model to write an assessment of the portfolio.
# Nothing leaves the lab: llama.kscsc.local is the GPU box, resolved by the
# static CoreDNS entry in the coreDNS chart.
#
# Leave apiKey empty and the feature stays switched off - the backend reports
# itself unconfigured and the page says so, rather than failing per request.
# Provide the key through a values file that is not committed, or point
# existingSecret at a Secret created out of band.
# Entra ID SSO. The browser runs OAuth 2.0 authorization code + PKCE against
# the tenant; the backend validates the resulting access token on every
# request. One app registration serves as both, so there is a single clientId.
#
# Nothing here is secret. A public client has no secret by definition, and both
# values travel in the address bar during sign-in - which is exactly why they
# can live in a values file instead of a Secret.
#
# They are served to the browser by the backend at /api/auth/config rather than
# baked into the frontend image: `next build` inlines NEXT_PUBLIC_* variables,
# and these images are built once in CI and deployed to whichever tenant the
# chart names.
auth:
  # Off leaves every API endpoint open. Only ever appropriate for a throwaway
  # local run - see the startup warning the backend logs.
  enabled: true
  tenantId: ""
  clientId: ""
  # The scope the SPA requests, exposed on the app's own Application ID URI as
  # api://<clientId>/<apiScope>.
  apiScope: access_as_user
  # App role the caller must hold. Paired with "Assignment required" on the
  # enterprise application, this - not tenant membership - is the actual gate.
  # Empty would admit anybody in the tenant.
  requiredRole: MyFinance.User

llm:
  enabled: true
  baseUrl: https://llama.kscsc.local:8443
  # Writes the assessment. Reasoning model; the router loads one model at a
  # time, so the first request after a switch waits on ~76 GB being paged in.
  model: Thinker
  # Translates a finished English report into Polish. A Polish-native model,
  # far better at it than asking the author model to write Polish directly.
  translateModel: Bielik
  #
  # Still required even with mutual TLS below. The certificate authenticates
  # this backend to the llama-server router, but the router does not forward
  # that identity to the model child it proxies inference to, so a certificate
  # alone gets 401 on /v1/chat/completions (measured 2026-09-17).
  #
  # Scope this key to the least-privilege `service` role in llama-server's
  # auth_policy, never the shared admin key: the certificate caps what this
  # pod may do, and the key should not be able to exceed it.
  apiKey: ""
  # Use a Secret that already exists instead of creating one from apiKey above.
  existingSecret: ""
  secretKey: llm-api-key

  tls:
    # Verify llama-server's certificate rather than trusting it blindly. On by
    # default because it works: see caConfigMap below for why this chart can
    # verify where news-bot could not.
    verify: true
    # Build the CA bundle from step-ca's ConfigMap at install time. Must supply
    # BOTH the root and the intermediate - the root has no keyUsage extension
    # and Python 3.13's strict verification rejects it as an anchor, while the
    # intermediate is accepted. See templates/configmap-llm-ca.yaml.
    caConfigMap:
      enabled: true
      namespace: step-ca
      name: step-ca-step-certificates-certs
      rootKey: root_ca.crt
      intermediateKey: intermediate_ca.crt
    # Pin the bundle literally instead of looking it up (takes precedence).
    caBundle: ""
    # Where the assembled bundle is mounted in the backend container.
    mountPath: /etc/myfinance/llm-ca

  # --- Mutual TLS ----------------------------------------------------------
  # The backend pod already carries an autocert-issued identity for PostgreSQL,
  # and that certificate has clientAuth in its EKU, so the same pair proves the
  # pod's identity to llama-server. No second certificate is needed and nothing
  # extra is mounted: these are the paths autocert already writes to.
  #
  # Safe to leave on before the server asks for a client certificate - a server
  # that does not request one never sees it.
  #
  # llama-server is configured (2026-09-17) to map this pod's SAN
  #
  #   myfinance-app.myfinance.svc.cluster.local
  #
  # to its least-privilege `service` role. Where both a certificate and a key
  # are presented the ROUTER authorizes on the certificate, so this is what
  # actually caps the pod's privileges - verified by /slots returning 403 even
  # when an admin-scoped key is sent alongside.
  #
  # Requires postgres.enabled (that is what puts autocert on the pod).
  mtls:
    enabled: true
    certFile: /var/run/autocert.step.sm/site.crt
    keyFile: /var/run/autocert.step.sm/site.key
  # A cold start of the 122B model plus generation. The HTTP request that
  # triggers it returns immediately - this bounds the worker thread, not the
  # browser - so a generous value costs nothing.
  timeout: 900

nodeSelector: {}
tolerations:
  - key: "nvidia.com/gpu"
    operator: "Exists"
    effect: "NoSchedule"
affinity: {}

# Both Services take traffic from the gateway and nothing else, since the
# gateway addresses each one directly. Egress is unrestricted — the price
# service calls out to open.er-api.com, gold-api.com and CoinGecko.
networkPolicy:
  enabled: true
  ingress:
    enabled: true
    namespace: envoy-gateway-system
    podLabels:
      app.kubernetes.io/name: envoy

# --- PostgreSQL with mutual TLS -------------------------------------------
# Replaces the SQLite file. Both ends present a certificate issued by the
# in-cluster step-ca and injected by autocert, so there is no password
# anywhere: the client's certificate *is* the credential.
#
# Two roles, because they need different powers:
#   owner - creates and migrates the schema, used only by the pre-upgrade Job
#   app   - what the API runs as: rows in and out, no DDL, owns nothing
postgres:
  enabled: true
  image:
    repository: postgres
    tag: "17-alpine"
    pullPolicy: IfNotPresent
  database: myfinance
  # The schema Job is a post-install/pre-upgrade hook, and pre-upgrade hooks
  # run BEFORE the release's own resources. That is the right order once
  # PostgreSQL exists - the migration must land before the new backend serves -
  # but it deadlocks on the very first switch from SQLite, when the Job waits
  # for a database the same upgrade has not created yet. Set this false for
  # that one bootstrap upgrade, then true again.
  schemaJob:
    enabled: true
  ownerRole: myfinance_owner
  appRole: myfinance_app
  service:
    port: 5432
  # autocert issues a cert per workload from the annotation below. The names
  # are DNS-shaped because step-ca's policy expects that; pg_ident.conf maps
  # them onto the two role names.
  autocert:
    # serverName is derived from the release name (see _helpers.tpl) so the
    # certificate always matches the Service clients connect to.
    appName: myfinance-app.myfinance.svc.cluster.local
    ownerName: myfinance-owner.myfinance.svc.cluster.local
    # Where autocert's bootstrapper and renewer drop site.crt/site.key/root.crt.
    mountPath: /var/run/autocert.step.sm
  # postgres:17-alpine runs as this uid; the private key has to be readable by
  # it and by nobody else, or libpq and the server both refuse to start.
  runAsUser: 70
  pvc:
    enabled: true
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 5Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
