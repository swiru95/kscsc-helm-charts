# Envoy Gateway routing for the Falco stack.
#
# This chart holds the HTTPRoutes and, optionally, NetworkPolicies for the
# stack. Falco itself, its driver
# DaemonSet, Falcosidekick and the Falcosidekick UI all come from the upstream
# falcosecurity/falco chart — see README.md for the install order.
#
# The upstream chart only knows how to emit an Ingress, and this cluster has no
# Ingress controller: Envoy Gateway terminates TLS at 192.168.95.51 and routes
# by Gateway API HTTPRoute. So upstream's webui.ingress stays disabled and the
# route lives here instead, matching how openvas and step-ca are wired.
#
# Authentication (Entra ID SSO on the UI, bearer-token ingestion from Sidekick)
# is configured in the UPSTREAM release's values plus the config Secret rendered
# by this chart (uiAuth below). The whole setup is secretless; see README.md.
# Nothing secret belongs in this file.

gateway:
  name: envoy-gateway
  namespace: envoy-gateway-system
  httpsListenerName: https
  httpListenerName: http
  hostname: falco.kscsc.local

  # Serve the UI on HTTPS only and 301 plain HTTP up to it. The UI is an
  # authenticated (OIDC) event console, so no reason to answer on cleartext.
  httpDirect: false

  # The UI streams events over a long-lived connection; the Envoy default of 60s
  # would cut the feed every minute and make the dashboard look broken.
  timeout: 300s

# UI pod: HTTPS, mTLS ingestion from Sidekick, OIDC browser login, Redis backend.
ui:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/swiru95/falcosidekick-ui
    tag: TAG_SET_AT_DEPLOY
  ttl: 604800
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 128Mi
  nodeSelector:
    kscsc.local/role: cpu

# Redis pod: TLS, cert-reloader sidecar, RediSearch + ReJSON modules.
redis:
  enabled: true
  storageSize: 5Gi
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 128Mi
  certReloader:
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 10m
        memory: 64Mi
  nodeSelector:
    kscsc.local/role: cpu

# Ingress-only NetworkPolicies for the upstream release's pods. Off by default so
# a first install cannot lock itself out; turn on once the stack is healthy.
networkPolicy:
  enabled: false
  # Helm release name of the upstream falcosecurity/falco chart; it is the
  # app.kubernetes.io/instance label on every pod of the stack.
  stackRelease: falco
  redisPort: 6379
  uiPort: 2802
  sidekickPort: 2801
  # The Envoy Gateway proxy namespace is taken from gateway.namespace above.

# Config for the Falcosidekick UI: OIDC + ingestion settings. Contains NO secret
# material (public OIDC client with PKCE, no client secret). Rendered as a ConfigMap
# that the UI pod envFroms.
uiAuth:
  enabled: true
  # Entra ID tenant and the app registration's application (client) ID. Neither
  # is secret; real values live in the private config repo.
  tenantId: 00000000-0000-0000-0000-000000000000
  clientId: 00000000-0000-0000-0000-000000000000
  # Empty: derived from gateway.hostname.
  redirectUrl: ""
  postLogoutRedirectUrl: ""
  scopes: openid,profile,email
  usernameClaim: preferred_username
  groupsClaim: roles
  allowedGroups: Falco.Viewer
  # Sidekick -> UI ingestion: validate the projected ServiceAccount token.
  ingest:
    issuer: https://kubernetes.default.svc.cluster.local
    audience: falcosidekick-ui
    allowedSubjects: system:serviceaccount:falco:falco-falcosidekick

# KSCSC root CA certificate for TLS validation (BackendTLSPolicy, UI probe).
# Copy from config/values/autocert__autocert.yaml root_ca.crt. Empty: skip BackendTLSPolicy.
rootCA: ""
