# Example values for the UPSTREAM falcosecurity/falco release (release name "falco").
# Real values live in the private config/ submodule (falco__falco.yaml).
# Nothing secret anywhere: the setup is secretless. The UI's OIDC/ingest settings
# are the Secret `falco-ui-auth` rendered by the falco-gw release (values block
# `uiAuth`, tenantId/clientId), which must be installed first. See README.md.
falcosidekick:
  enabled: true
  image:
    registry: ghcr.io
    repository: swiru95/falcosidekick
    tag: TAG_SET_AT_DEPLOY        # commit SHA of the fork build
  # Sidekick -> UI ingestion: a projected ServiceAccount token, rotated by kubelet.
  config:
    extraEnv:
    - name: WEBUI_TOKENFILE
      value: /var/run/secrets/tokens/falcosidekick-ui
  extraVolumes:
  - name: ui-token
    projected:
      sources:
      - serviceAccountToken:
          audience: falcosidekick-ui
          expirationSeconds: 3600
          path: falcosidekick-ui
  extraVolumeMounts:
  - name: ui-token
    mountPath: /var/run/secrets/tokens
    readOnly: true
  webui:
    enabled: true
    disableauth: false
    user: ""                      # empty: the chart default would be admin:admin
    existingSecret: falco-ui-auth # rendered by falco-gw; envFrom on the UI and its wait-redis init container
    image:
      registry: ghcr.io
      repository: swiru95/falcosidekick-ui
      tag: TAG_SET_AT_DEPLOY
    ingress:
      enabled: false              # routed by the falco-gw chart instead
    redis:
      enabled: true
      # No password: access is restricted by the NetworkPolicy (UI pods only).
