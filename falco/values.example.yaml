# Example values for the UPSTREAM falcosecurity/falco release (release name "falco").
# Real values live in the private config/ submodule (falco__falco.yaml).
# Nothing secret goes here: OIDC settings and the Redis password live in two
# Secrets you create by hand, see README.md "Access".
falcosidekick:
  enabled: true
  image:
    registry: ghcr.io
    repository: swiru95/falcosidekick
    tag: TAG_SET_AT_DEPLOY        # commit SHA of the fork build
  # Sidekick -> UI ingestion: a projected ServiceAccount token, rotated by kubelet.
  config:
    extraEnv:
    - name: WEBUI_TOKENFILE
      value: /var/run/secrets/tokens/falcosidekick-ui
  extraVolumes:
  - name: ui-token
    projected:
      sources:
      - serviceAccountToken:
          audience: falcosidekick-ui
          expirationSeconds: 3600
          path: falcosidekick-ui
  extraVolumeMounts:
  - name: ui-token
    mountPath: /var/run/secrets/tokens
    readOnly: true
  webui:
    enabled: true
    disableauth: false
    user: ""                      # empty: the chart default would be admin:admin
    existingSecret: falco-ui-auth # envFrom on the UI and its wait-redis init container
    image:
      registry: ghcr.io
      repository: swiru95/falcosidekick-ui
      tag: TAG_SET_AT_DEPLOY
    ingress:
      enabled: false              # routed by the falco-gw chart instead
    redis:
      enabled: true
      existingSecret: falco-redis # keys REDIS_ARGS, REDIS_PASSWORD
      password: set-via-existing-secret  # dummy, must be non-empty; see README
