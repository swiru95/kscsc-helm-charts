{{- if .Values.redis.enabled }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: falco-ui-redis
  labels:
    app.kubernetes.io/name: falco-ui-redis
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  serviceName: falco-ui-redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: falco-ui-redis
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        autocert.step.sm/name: falco-ui-redis.falco.svc.cluster.local
        checksum/acl: {{ include (print $.Template.BasePath "/redis-acl-configmap.yaml") . | sha256sum }}
      labels:
        app.kubernetes.io/name: falco-ui-redis
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: "redis/redis-stack-server:7.2.0-v11"
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              sha256sum /var/run/autocert.step.sm/site.crt /var/run/autocert.step.sm/site.key > /tmp/loaded-cert.sha256
              exec redis-server \
                --port 0 \
                --tls-port 6379 \
                --tls-cert-file /var/run/autocert.step.sm/site.crt \
                --tls-key-file /var/run/autocert.step.sm/site.key \
                --tls-ca-cert-file /var/run/autocert.step.sm/root.crt \
                --tls-auth-clients yes \
                --protected-mode no \
                --dir /data \
                --save "3600 1 300 100 60 10000" \
                --maxmemory {{ .Values.redis.maxmemory }} \
                --maxmemory-policy {{ .Values.redis.maxmemoryPolicy }} \
                --loadmodule /opt/redis-stack/lib/redisearch.so \
                --loadmodule /opt/redis-stack/lib/rejson.so \
                --aclfile /etc/redis/acl/users.acl
          ports:
            - name: https
              containerPort: 6379
              protocol: TCP
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - |
                  sha256sum /var/run/autocert.step.sm/site.crt /var/run/autocert.step.sm/site.key | cmp -s - /tmp/loaded-cert.sha256 || exit 1
                  redis-cli --tls --cert /var/run/autocert.step.sm/site.crt --key /var/run/autocert.step.sm/site.key --cacert /var/run/autocert.step.sm/root.crt -h 127.0.0.1 -p 6379 ping | grep -q PONG
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 2
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - redis-cli
                - --tls
                - --cert
                - /var/run/autocert.step.sm/site.crt
                - --key
                - /var/run/autocert.step.sm/site.key
                - --cacert
                - /var/run/autocert.step.sm/root.crt
                - -h
                - 127.0.0.1
                - -p
                - "6379"
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
            - name: acl
              mountPath: /etc/redis/acl
              readOnly: true
          {{- if .Values.redis.resources }}
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          {{- end }}
      terminationGracePeriodSeconds: 30
      {{- if .Values.redis.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.redis.nodeSelector | nindent 8 }}
      {{- end }}
      volumes:
        - name: acl
          configMap:
            name: falco-ui-redis-acl
            defaultMode: 0444
      {{- if .Values.redis.existingClaim }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.redis.existingClaim }}
      {{- end }}
  {{- if not .Values.redis.existingClaim }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.redis.storageSize | default "5Gi" }}
  {{- end }}
{{- end }}
