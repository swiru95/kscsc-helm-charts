{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "news-bot.secretName" . }}
  labels:
    {{- include "news-bot.labels" . | nindent 4 }}
type: Opaque
stringData:
  linkedin-client-id: {{ .Values.secrets.linkedin.clientId | quote }}
  linkedin-client-secret: {{ .Values.secrets.linkedin.clientSecret | quote }}
  linkedin-org-urn: {{ .Values.secrets.linkedin.orgUrn | quote }}
  linkedin-org-token: {{ .Values.secrets.linkedin.orgToken | quote }}
  linkedin-org-refresh-token: {{ .Values.secrets.linkedin.orgRefreshToken | quote }}
  linkedin-personal-token: {{ .Values.secrets.linkedin.personalToken | quote }}
  linkedin-personal-refresh-token: {{ .Values.secrets.linkedin.personalRefreshToken | quote }}
  {{- if .Values.ollama.authHeader }}
  {{ .Values.ollama.authSecretKey }}: {{ .Values.ollama.authHeader | quote }}
  {{- end }}
{{- end }}
