{{- if .Values.linkedin.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "news-bot.fullname" . }}-linkedin
  labels:
    {{- include "news-bot.labels" . | nindent 4 }}
    {{- include "news-bot.linkedinSelectorLabels" . | nindent 4 }}
spec:
  schedule: {{ .Values.linkedin.schedule | quote }}
  {{- if .Values.linkedin.timeZone }}
  timeZone: {{ .Values.linkedin.timeZone | quote }}
  {{- end }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ .Values.linkedin.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.linkedin.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: {{ .Values.linkedin.ttlSecondsAfterFinished }}
      backoffLimit: {{ .Values.linkedin.backoffLimit }}
      activeDeadlineSeconds: {{ .Values.linkedin.activeDeadlineSeconds }}
      template:
        metadata:
          labels:
            {{- include "news-bot.linkedinSelectorLabels" . | nindent 12 }}
            {{- with .Values.podLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.podAnnotations }}
          annotations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        spec:
          restartPolicy: OnFailure
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
            seccompProfile:
              type: RuntimeDefault
          automountServiceAccountToken: false
          {{- if .Values.trustedCA.enabled }}
          initContainers:
            {{- include "news-bot.trustedCA.initContainer" . | nindent 12 }}
          {{- end }}
          containers:
            - name: linkedin-feeder
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              {{- if .Values.linkedin.skipIfUnchanged }}
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -u
                  NEWS_FILE="/data/output/NEWS.md"
                  NEWS_JSON="/data/output/news.json"
                  HASH_FILE="{{ .Values.linkedin.hashFilePath }}"

                  if [ ! -s "$NEWS_FILE" ]; then
                    echo "No NEWS.md content found, skipping LinkedIn posting."
                    exit 0
                  fi

                  NEW_HASH="$(sha256sum "$NEWS_FILE" | awk '{print $1}')"
                  if [ -f "$HASH_FILE" ] && [ "$(cat "$HASH_FILE")" = "$NEW_HASH" ]; then
                    echo "NEWS.md unchanged since last successful post, skipping."
                    exit 0
                  fi

                  linkedin-feeder --news="$NEWS_FILE" --post-json="$NEWS_JSON" --no-verify-tls{{- range .Values.linkedin.extraArgs }} {{ . | quote }}{{- end }}
                  EXIT_CODE=$?

                  if [ "$EXIT_CODE" -eq 0 ]; then
                    echo "$NEW_HASH" > "$HASH_FILE"
                  fi

                  exit "$EXIT_CODE"
              {{- else }}
              command: ["linkedin-feeder"]
              args:
                - "--news=/data/output/NEWS.md"
                - "--post-json=/data/output/news.json"
                - "--no-verify-tls"
                {{- range .Values.linkedin.extraArgs }}
                - {{ . | quote }}
                {{- end }}
              {{- end }}
              env:
                - name: LINKEDIN_CLIENT_ID
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "news-bot.secretName" . }}
                      key: linkedin-client-id
                - name: LINKEDIN_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "news-bot.secretName" . }}
                      key: linkedin-client-secret
                - name: LINKEDIN_ORG_URN
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "news-bot.secretName" . }}
                      key: linkedin-org-urn
                - name: LINKEDIN_ORG_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "news-bot.secretName" . }}
                      key: linkedin-org-token
                - name: LINKEDIN_ORG_REFRESH_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "news-bot.secretName" . }}
                      key: linkedin-org-refresh-token
                      optional: true
                - name: LINKEDIN_PERSONAL_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "news-bot.secretName" . }}
                      key: linkedin-personal-token
                      optional: true
                - name: LINKEDIN_PERSONAL_REFRESH_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "news-bot.secretName" . }}
                      key: linkedin-personal-refresh-token
                      optional: true
                - name: LINKEDIN_TOKEN_CACHE_PATH
                  value: "/data/output/.linkedin_tokens.json"
                - name: LLM_AUTH_HEADER
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "news-bot.secretName" . }}
                      key: {{ .Values.ollama.authSecretKey }}
                      optional: true
                {{- if .Values.trustedCA.enabled }}
                {{- include "news-bot.trustedCA.env" . | nindent 16 }}
                {{- end }}
              envFrom:
                - configMapRef:
                    name: {{ include "news-bot.fullname" . }}-config
              resources:
                {{- toYaml .Values.linkedin.resources | nindent 16 }}
              volumeMounts:
                - name: data
                  mountPath: /data
                - name: tmp
                  mountPath: /tmp
                {{- if .Values.trustedCA.enabled }}
                {{- include "news-bot.trustedCA.volumeMounts" . | nindent 16 }}
                {{- end }}
          volumes:
            {{- if .Values.trustedCA.enabled }}
            {{- include "news-bot.trustedCA.volumes" . | nindent 12 }}
            {{- end }}
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi
            - name: data
              {{- if .Values.persistence.enabled }}
              persistentVolumeClaim:
                claimName: {{ include "news-bot.pvcName" . }}
              {{- else }}
              emptyDir: {}
              {{- end }}
          {{- include "news-bot.scheduling" . | nindent 10 }}
{{- end }}
