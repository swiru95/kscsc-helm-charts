apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "news-bot.fullname" . }}-config
  labels:
    {{- include "news-bot.labels" . | nindent 4 }}
data:
  config.yaml: |
    feeds: []

    settings:
      max_article_age_hours: {{ .Values.config.maxArticleAgeHours }}
      output_path: "/data/output/news.json"
      embedding_model: {{ .Values.config.embeddingModel | quote }}
      clustering_threshold: {{ .Values.config.clusteringThreshold }}
      drop_non_english: {{ .Values.config.dropNonEnglish }}
      security_only: {{ .Values.config.securityOnly }}
      web_research: {{ .Values.config.webResearch }}
      search_max_results: {{ .Values.config.searchMaxResults }}
      top_n: {{ .Values.config.topN }}
      validate_sources: {{ .Values.config.validateSources }}
      incremental: {{ .Values.config.incremental }}
      state_path: "/data/output/.news_bot_state.json"
      state_retention_days: {{ .Values.config.stateRetentionDays }}

      llm:
        provider: {{ .Values.ollama.provider | quote }}
        model: {{ .Values.ollama.model | quote }}
        {{- with .Values.ollama.fastModel }}
        fast_model: {{ . | quote }}
        {{- end }}
        api_url: {{ .Values.ollama.apiUrl | quote }}
        {{- if .Values.ollama.authHeader }}
        auth_header: {{ .Values.ollama.authHeader | quote }}
        {{- end }}
        tls_verify: {{ .Values.ollama.tlsVerify }}
        auth_source: {{ .Values.ollama.authSource | quote }}
        web_search: {{ .Values.ollama.webSearch }}
        ollama_base_url: {{ .Values.ollama.ollamaBaseUrl | quote }}
        max_retries: {{ .Values.ollama.maxRetries }}
        timeout: {{ .Values.ollama.timeout }}

      fetch:
        timeout: {{ .Values.config.fetch.timeout }}
        max_articles_per_feed: {{ .Values.config.fetch.maxArticlesPerFeed }}

  # Environment variables for the linkedin-feeder CronJob (envFrom). The API keys
  # are NOT here — they come from the Secret. Names must match what the feeder
  # actually reads (news_to_linkedin.py): it looks for OLLAMA_*, not LLM_*.
  OLLAMA_HOST: {{ include "news-bot.llmHost" . | quote }}
  OLLAMA_MODEL: {{ .Values.ollama.model | quote }}
  OLLAMA_TLS_VERIFY: {{ .Values.ollama.tlsVerify | quote }}
  LINKEDIN_ORG_NAME: {{ .Values.linkedinOrg.name | quote }}
  LINKEDIN_ORG_URL: {{ .Values.linkedinOrg.url | quote }}
  # Post illustration. LINKEDIN_POST_IMAGE=false switches it off without removing
  # the key; the feeder also stays inert if GOOGLE_AI_API_KEY is unset.
  LINKEDIN_POST_IMAGE: {{ .Values.googleAI.enabled | quote }}
  {{- with .Values.googleAI.imageModel }}
  GOOGLE_IMAGE_MODEL: {{ . | quote }}
  {{- end }}
  {{- with .Values.googleAI.aspectRatio }}
  IMAGE_ASPECT_RATIO: {{ . | quote }}
  {{- end }}
  {{- with .Values.googleAI.imageSize }}
  IMAGE_SIZE: {{ . | quote }}
  {{- end }}
