# -- Image -------------------------------------------------------------------
image:
  repository: ghcr.io/swiru95/news-bot
  tag: 2b8ca4b13004f3b238d9a84bea4e72e2e873e0a2
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-pull-secret

# -- News-bot pipeline -------------------------------------------------------
newsbot:
  schedule: "0 14 * * 1-5"
  timeZone: "Europe/Warsaw"
  backoffLimit: 2
  # Full pipeline (web research + LLM refine/summarise for ~50 clusters) on the
  # GPU-backed 12B model runs well past the old 30m cap; give it headroom.
  activeDeadlineSeconds: 5400
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  ttlSecondsAfterFinished: 3600

  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 4Gi

  extraArgs: []
  extraEnv: []

# -- LinkedIn feeder ---------------------------------------------------------
linkedin:
  enabled: true
  schedule: "0 16 * * 1-5"
  timeZone: "Europe/Warsaw"
  skipIfUnchanged: true
  hashFilePath: "/data/output/.linkedin_last_news.sha256"
  backoffLimit: 1
  # Give the feeder enough room to wait for Ollama and still finish the post.
  activeDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  ttlSecondsAfterFinished: 1800

  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi

  extraArgs: []

# -- Pipeline config ---------------------------------------------------------
config:
  maxArticleAgeHours: 24
  embeddingModel: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
  clusteringThreshold: 0.3
  dropNonEnglish: true
  securityOnly: true
  webResearch: false
  searchMaxResults: 5
  topN: 5
  validateSources: false
  incremental: false
  stateRetentionDays: 14
  fetch:
    timeout: 15
    maxArticlesPerFeed: 20

# -- LLM backend -------------------------------------------------------------
# Backend is llama-server (llama.cpp) at llama.kscsc.local:8443 over HTTPS. Both the main
# news-bot pipeline and the linkedin-feeder CronJob use the same OpenAI-compatible
# endpoint (/v1/chat/completions) with an Authorization header for authentication.
ollama:
  provider: "ollama"
  model: "Qwen/Qwen3-32B-GGUF:Q4_K_M"
  apiUrl: "https://llama.kscsc.local:8443/v1/chat/completions"
  # Full Authorization header value, e.g. "Bearer <key>". llama-server runs with
  # --api-key-file and rejects unauthenticated calls with 401. Supply at deploy
  # time (--set ollama.authHeader=...); keep empty in git. Also written to the
  # Secret as authSecretKey when secrets.create is true.
  authHeader: ""
  # Cannot be true yet, even though trustedCA puts the KSCSC root in the bundle:
  # that root carries no keyUsage extension, and this image is on Python 3.13,
  # where ssl.create_default_context() enables VERIFY_X509_STRICT by default —
  # which rejects a CA cert without keyUsage (error 92). Flip to true once the
  # root has been re-issued with keyUsage certSign/cRLSign.
  tlsVerify: false
  authSource: "claude_cli"
  webSearch: false
  ollamaBaseUrl: "http://localhost:11434"
  maxRetries: 1
  # LinkedIn generation and source summarization can take longer on the in-cluster model.
  timeout: 600
  # Key inside the existing Secret (secrets.existingSecret) that holds the full
  # Authorization header for the LinkedIn feeder; mounted as LLM_AUTH_HEADER.
  # The env var is optional, so the chart still renders if the key is absent.
  authSecretKey: "llm-auth-header"

# -- Private CA trust --------------------------------------------------------
# llama-server presents a cert from the in-cluster step-ca, whose root is in no
# public bundle. An init container appends it to the image's CA bundle so TLS
# verification can stay on; the public roots stay in place because the pipeline
# also fetches RSS over public HTTPS.
# The PEM is read from step-ca's own ConfigMap at install time; set `pem`
# instead to pin it literally (needed if the CA lives outside this cluster).
trustedCA:
  enabled: true
  sourceNamespace: "step-ca"
  sourceConfigMap: "step-ca-step-certificates-certs"
  sourceKey: "root_ca.crt"
  pem: ""

# -- LinkedIn org metadata ---------------------------------------------------
linkedinOrg:
  name: ""
  url: ""

# -- Feeds (OPML) ------------------------------------------------------------
feeds:
  inline: ""
  existingConfigMap: "news-bot-feeds"

# -- Secrets -----------------------------------------------------------------
secrets:
  create: false
  existingSecret: "news-bot-secrets"
  linkedin:
    clientId: ""
    clientSecret: ""
    orgUrn: ""
    orgToken: ""
    orgRefreshToken: ""
    personalToken: ""
    personalRefreshToken: ""

# -- Persistence -------------------------------------------------------------
persistence:
  enabled: true
  size: 1Gi
  storageClassName: ""
  existingClaim: ""

# -- Common ------------------------------------------------------------------
nameOverride: ""
fullnameOverride: ""

nodeSelector: {}
tolerations:
  - key: "nvidia.com/gpu"
    operator: "Exists"
    effect: "NoSchedule"
affinity: {}

podLabels:
  app: news-bot

podAnnotations: {}
