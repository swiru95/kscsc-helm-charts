# Example values - real deployment values live in the private config/ submodule.
# Credential fields are blanked; supply them at deploy time, e.g.
#   --set ollama.apiKey=... --set googleAI.apiKey=...

affinity: {}
config:
  clusteringThreshold: 0.3
  dropNonEnglish: true
  embeddingModel: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
  fetch:
    maxArticlesPerFeed: 20
    timeout: 15
  incremental: false
  maxArticleAgeHours: 24
  searchMaxResults: 5
  securityOnly: true
  stateRetentionDays: 14
  topN: 5
  validateSources: false
  webResearch: false
feeds:
  existingConfigMap: news-bot-feeds
  inline: ''
fullnameOverride: ''
googleAI:
  apiKey: ''
  apiKeySecretKey: google-ai-api-key
  aspectRatio: '16:9'
  enabled: true
  imageModel: gemini-3.1-flash-image
  imageSize: 2K
image:
  pullPolicy: IfNotPresent
  repository: ghcr.io/swiru95/news-bot
  tag: f79722356b04878702ef60eb57f997b3a65342df
imagePullSecrets:
- name: ghcr-pull-secret
linkedin:
  activeDeadlineSeconds: 3600
  backoffLimit: 1
  enabled: true
  extraArgs: []
  failedJobsHistoryLimit: 1
  hashFilePath: /data/output/.linkedin_last_news.sha256
  resources:
    limits:
      cpu: '1'
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 256Mi
  schedule: 0 16 * * 1-5
  skipIfUnchanged: true
  successfulJobsHistoryLimit: 1
  timeZone: Europe/Warsaw
  ttlSecondsAfterFinished: 1800
linkedinOrg:
  name: ''
  url: ''
nameOverride: ''
newsbot:
  activeDeadlineSeconds: 5400
  backoffLimit: 2
  extraArgs: []
  extraEnv: []
  failedJobsHistoryLimit: 1
  resources:
    limits:
      cpu: '2'
      memory: 4Gi
    requests:
      cpu: 500m
      memory: 2Gi
  schedule: 0 14 * * 1-5
  successfulJobsHistoryLimit: 1
  timeZone: Europe/Warsaw
  ttlSecondsAfterFinished: 3600
nodeSelector: {}
ollama:
  apiKey: ''
  apiKeySecretKey: llm-api-key
  apiUrl: https://llama.kscsc.local:8443/v1/chat/completions
  authHeader: ''
  authSource: claude_cli
  fastModel: Coder
  maxRetries: 1
  model: Thinker
  ollamaBaseUrl: http://localhost:11434
  provider: ollama
  timeout: 1200
  tlsVerify: false
  webSearch: false
persistence:
  enabled: true
  existingClaim: ''
  size: 1Gi
  storageClassName: ''
podAnnotations: {}
podLabels:
  app: news-bot
secrets:
  create: false
  existingSecret: news-bot-secrets
  linkedin:
    clientId: ''
    clientSecret: ''
    orgRefreshToken: ''
    orgToken: ''
    orgUrn: ''
    personalRefreshToken: ''
    personalToken: ''
tolerations:
- effect: NoSchedule
  key: nvidia.com/gpu
  operator: Exists
trustedCA:
  enabled: true
  pem: ''
  sourceConfigMap: step-ca-step-certificates-certs
  sourceKey: root_ca.crt
  sourceNamespace: step-ca
