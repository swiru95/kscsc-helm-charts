# Example values - real deployment values live in the private config/ submodule.
# Credential fields are blanked; supply them at deploy time.

affinity: {}
config:
  clusteringThreshold: 0.3
  dropNonEnglish: true
  embeddingModel: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
  fetch:
    maxArticlesPerFeed: 20
    timeout: 15
  incremental: false
  maxArticleAgeHours: 24
  searchMaxResults: 5
  securityOnly: true
  stateRetentionDays: 14
  topN: 5
  validateSources: false
  webResearch: false
feeds:
  existingConfigMap: news-bot-feeds
  inline: ''
fullnameOverride: ''
image:
  pullPolicy: IfNotPresent
  repository: ghcr.io/swiru95/news-bot
  tag: 2b8ca4b13004f3b238d9a84bea4e72e2e873e0a2
imagePullSecrets:
- name: ghcr-pull-secret
linkedin:
  activeDeadlineSeconds: 3600
  backoffLimit: 1
  enabled: true
  extraArgs: []
  failedJobsHistoryLimit: 1
  hashFilePath: /data/output/.linkedin_last_news.sha256
  resources:
    limits:
      cpu: '1'
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 256Mi
  schedule: 0 16 * * 1-5
  skipIfUnchanged: true
  successfulJobsHistoryLimit: 1
  timeZone: Europe/Warsaw
  ttlSecondsAfterFinished: 1800
linkedinOrg:
  name: ''
  url: ''
nameOverride: ''
newsbot:
  activeDeadlineSeconds: 5400
  backoffLimit: 2
  extraArgs: []
  extraEnv: []
  failedJobsHistoryLimit: 1
  resources:
    limits:
      cpu: '2'
      memory: 4Gi
    requests:
      cpu: 500m
      memory: 2Gi
  schedule: 0 14 * * 1-5
  successfulJobsHistoryLimit: 1
  timeZone: Europe/Warsaw
  ttlSecondsAfterFinished: 3600
nodeSelector: {}
ollama:
  apiUrl: https://llama.kscsc.local:8443/v1/chat/completions
  authHeader: ''
  authSecretKey: ''
  authSource: claude_cli
  host: http://ollama-ollama.ollama.svc.cluster.local:11434
  maxRetries: 1
  model: Qwen/Qwen3-32B-GGUF:Q4_K_M
  ollamaBaseUrl: http://localhost:11434
  provider: ollama
  timeout: 600
  tlsVerify: false
  webSearch: false
persistence:
  enabled: true
  existingClaim: ''
  size: 1Gi
  storageClassName: ''
podAnnotations: {}
podLabels:
  app: news-bot
secrets:
  create: false
  existingSecret: ''
  linkedin:
    clientId: ''
    clientSecret: ''
    orgRefreshToken: ''
    orgToken: ''
    orgUrn: ''
    personalRefreshToken: ''
    personalToken: ''
tolerations:
- effect: NoSchedule
  key: nvidia.com/gpu
  operator: Exists
