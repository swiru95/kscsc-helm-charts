
replicaCount: 1

image:
  repository: ollama/ollama
  tag: "0.30.8"
  pullPolicy: Always

service:
  type: ClusterIP
  port: 11434

pvc:
  enabled: true
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 50Gi
  name: ""

models:
  - SpeakLeash/bielik-11b-v3.0-instruct:Q6_K
  - gemma4:12b
  - gpt-oss:20b

commandArgs: []

env:
  OLLAMA_KEEP_ALIVE: "3h"
  # GPU is Blackwell (RTX 5060 Ti, CUDA 13). Pin the CUDA library so ollama's
  # GPU-discovery probe only tries cuda_v13 instead of also probing cuda_v12 and
  # blowing the 30s discovery watchdog -> silent CPU-only fallback on restarts.
  OLLAMA_LLM_LIBRARY: "cuda_v13"

resources:
  requests:
    cpu: "2"
    memory: "8Gi"
  limits:
    cpu: "4"
    memory: "16Gi"

gpu:
  enabled: true
  resourceName: "nvidia.com/gpu"
  count: 1
  nodeSelector:
  tolerations:
    - key: "nvidia.com/gpu"
      operator: "Exists"
      effect: "NoSchedule"
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: nvidia.com/gpu.present
                operator: In
                values:
                  - "true"

runtimeClassName: "nvidia"
podSecurityContext: {}
containerSecurityContext: {}

ingress:
  enabled: false

gateway:
  name: envoy-gateway
  namespace: envoy-gateway-system
  httpsListenerName: https
  httpListenerName: http
  hostname: ollama.kscsc.local
  serviceName: ollama-ollama
  servicePort: 11434
  httpDirect: false
  timeout: 1200s

networkPolicy:
  enabled: true
  allow:
    - name: openui
      namespace: openui
    - name: news-bot
      namespace: news-bot
      
  ingress:
    enabled: true
    namespace: envoy-gateway-system
    podLabels:
      app.kubernetes.io/name: envoy
