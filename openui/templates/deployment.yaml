apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openui.fullname" . }}
  labels:
    app: {{ include "openui.name" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "openui.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "openui.name" . }}
    spec:
{{- if .Values.trustedCA.enabled }}
      # The image bundle has no KSCSC root, so llama-server's HTTPS cert would
      # fail verification. Append the root instead of replacing the bundle —
      # OIDC still needs the public CAs to reach the identity provider.
      initContainers:
        - name: ca-bundle
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - cat /etc/ssl/certs/ca-certificates.crt /kscsc-ca/root_ca.crt > /ca-bundle/ca-certificates.crt
          volumeMounts:
            - name: kscsc-ca
              mountPath: /kscsc-ca
              readOnly: true
            - name: ca-bundle
              mountPath: /ca-bundle
{{- end }}
      containers:
        - name: openui
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
          env:
            # Env vars below are PersistentConfig in Open WebUI: with a PVC they
            # only seed the DB on first run unless persistence is turned off.
            - name: ENABLE_PERSISTENT_CONFIG
              value: "{{ .Values.persistentConfig }}"

            # --- LLM backends ---
            - name: ENABLE_OLLAMA_API
              value: "{{ .Values.ollama.enabled }}"
{{- if .Values.ollama.enabled }}
            - name: OLLAMA_BASE_URL
              value: "{{ .Values.ollama.baseUrl }}"
{{- end }}
            - name: ENABLE_OPENAI_API
              value: "{{ .Values.openai.enabled }}"
{{- if .Values.openai.enabled }}
            - name: OPENAI_API_BASE_URL
              value: "{{ .Values.openai.baseUrl }}"
{{- if .Values.openai.apiKeySecretName }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: "{{ .Values.openai.apiKeySecretName }}"
                  key: "{{ .Values.openai.apiKeyKey | default "api-key" }}"
{{- else }}
            - name: OPENAI_API_KEY
              value: "{{ .Values.openai.apiKey }}"
{{- end }}
{{- end }}

            # --- OIDC Configuration ---
{{- if .Values.oidc.enabled }}
            # 1. The Provider URL (Issuer)
            - name: OPENID_PROVIDER_URL
              value: "{{ .Values.oidc.issuer }}"

            # 2. Client ID
            - name: OAUTH_CLIENT_ID
              value: "{{ .Values.oidc.clientID }}"

            # 3. Client Secret
{{- if .Values.oidc.clientSecretSecretName }}
            - name: OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: "{{ .Values.oidc.clientSecretSecretName }}"
                  key: "{{ .Values.oidc.clientSecretKey | default "client-secret" }}"
{{- else }}
            - name: OAUTH_CLIENT_SECRET
              value: "{{ .Values.oidc.clientSecret }}"
{{- end }}

            # 4. Scopes
            - name: OAUTH_SCOPES
              value: "{{ join " " .Values.oidc.scopes }}"
              
            # 5. Redirect URI
            {{- if .Values.oidc.redirectURI }}
            - name: OAUTH_REDIRECT_URI
              value: "{{ .Values.oidc.redirectURI }}"
            {{- end }}
{{- end }}

            # --- EXTRA ENV (Crucial for SSO Enforcement) ---
            # This allows you to inject ENABLE_LOGIN_FORM, WEBUI_URL, etc.
            {{- if .Values.extraEnv }}
            {{- toYaml .Values.extraEnv | nindent 12 }}
            {{- end }}
{{- if .Values.trustedCA.enabled }}

            # --- Private CA trust ---
            # requests reads REQUESTS_CA_BUNDLE; everything on the stdlib ssl
            # module (aiohttp, httpx) reads SSL_CERT_FILE.
            - name: SSL_CERT_FILE
              value: /etc/ssl/certs/ca-certificates.crt
            - name: REQUESTS_CA_BUNDLE
              value: /etc/ssl/certs/ca-certificates.crt
{{- end }}

{{- if or .Values.pvc.enabled .Values.trustedCA.enabled }}
          volumeMounts:
{{- if .Values.pvc.enabled }}
            - name: data
              mountPath: /app/backend/data
{{- end }}
{{- if .Values.trustedCA.enabled }}
            - name: ca-bundle
              mountPath: /etc/ssl/certs/ca-certificates.crt
              subPath: ca-certificates.crt
              readOnly: true
{{- end }}
{{- end }}
          resources:
{{ toYaml .Values.resources | indent 12 }}
{{- if or .Values.pvc.enabled .Values.trustedCA.enabled }}
      volumes:
{{- if .Values.pvc.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ if .Values.pvc.name }}{{ .Values.pvc.name }}{{ else }}{{ include "openui.fullname" . }}-data{{ end }}
{{- end }}
{{- if .Values.trustedCA.enabled }}
        - name: kscsc-ca
          configMap:
            name: {{ include "openui.fullname" . }}-trusted-ca
        - name: ca-bundle
          emptyDir: {}
{{- end }}
{{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}