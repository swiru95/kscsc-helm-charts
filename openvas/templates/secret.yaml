{{- if and .Values.adminUser.enabled (not .Values.adminUser.existingSecret) }}
{{- if not .Values.adminUser.password }}
{{- fail "adminUser.enabled is true but no password is set: set adminUser.password, or point adminUser.existingSecret at a Secret you created yourself" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openvas.fullname" . }}-admin
  labels:
    app: {{ include "openvas.name" . }}
type: Opaque
stringData:
  {{ .Values.adminUser.passwordKey }}: {{ .Values.adminUser.password | quote }}
{{- end }}
