# coreDNS-custom values
# Creates the coredns-custom ConfigMap in kube-system and optionally patches
# the CoreDNS Deployment to add GPU tolerations.

# ---------------------------------------------------------------------------
# DNS zone served by the custom server block
# ---------------------------------------------------------------------------
zone: kscsc.local

# -- ClusterIP of the nginx ingress controller
ingressIP: ""
# -- ClusterIP of the Envoy Gateway LoadBalancer service
envoyIP: ""

# -- Host entries split by ingress controller
hosts:
  nginx: []
  envoy:
    - actualbudget.kscsc.local
    - ollama.kscsc.local
    - openui.kscsc.local
    - ca.kscsc.local
    - splunk.kscsc.local
    - auth.kscsc.local

# ---------------------------------------------------------------------------
# CoreDNS Deployment patch (GPU toleration)
# ---------------------------------------------------------------------------
patch:
  # -- Whether to continuously reconcile the CoreDNS deployment with the GPU toleration
  enabled: true
  # -- How often to re-check CoreDNS after k3s re-applies the built-in addon on host restart
  schedule: "*/2 * * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  image:
    repository: bitnami/kubectl
    tag: latest
    pullPolicy: IfNotPresent
  toleration:
    key: "nvidia.com/gpu"
    operator: "Exists"
    effect: "NoSchedule"
