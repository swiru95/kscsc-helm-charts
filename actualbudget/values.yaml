# Upstream community-charts/actualbudget values
actualbudget:
  fullnameOverride: "actualbudget"
  replicaCount: 1
  strategy:
    type: Recreate

  tolerations:
    - key: "nvidia.com/gpu"
      operator: "Exists"
      effect: "NoSchedule"

  persistence:
    enabled: true
    size: 20Gi
    accessModes:
      - ReadWriteOnce
    storageClass: ""
    existingClaim: ""

  files:
    dataDirectory: /data
    server: /data/server-files
    user: /data/user-files

  ingress:
    enabled: false

  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 512Mi

  # login.openid is required by the upstream chart's JSON schema validation.
  # Actual runtime config is injected via extraEnvVars (ingress.enabled: false
  # prevents the upstream chart from creating or mounting the OIDC secret).
  login:
    method: openid
    skipSSLVerification: true
    allowedLoginMethods:
      - openid
    openid:
      enforce: true
      providerName: "KSCSC Entra"
      discoveryUrl: &oidcDiscoveryUrl ""
      clientId:     &oidcClientId     ""
      clientSecret: &oidcClientSecret ""
      authMethod: "openid"
      tokenExpiration: 3600

  extraEnvVars:
    ACTUAL_OPENID_ENFORCE: "true"
    ACTUAL_OPENID_PROVIDER_NAME: "KSCSC Entra"
    ACTUAL_OPENID_DISCOVERY_URL: *oidcDiscoveryUrl
    ACTUAL_OPENID_CLIENT_ID:     *oidcClientId
    ACTUAL_OPENID_CLIENT_SECRET: *oidcClientSecret
    ACTUAL_OPENID_AUTH_METHOD: "openid"
    ACTUAL_TOKEN_EXPIRATION: "3600"

# Envoy Gateway HTTPRoute configuration
gateway:
  name: envoy-gateway
  namespace: envoy-gateway-system
  httpsListenerName: https
  httpListenerName: http
  hostname: actualbudget.kscsc.local
  serviceName: actualbudget
  servicePort: 5006
